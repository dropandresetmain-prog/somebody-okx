<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Somebody × OKX — SEQ-1 Brand Hook</title>
<style>
:root {
  --paper: #f5f2eb;
  --surface: rgba(255, 255, 255, 0.82);
  --ink: #22231f;
  --ink-soft: #66655e;
  --line: rgba(34, 35, 31, 0.12);
  --stage-width: 1920px;
  --stage-height: 1080px;
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: #ded8cd;
  text-rendering: geometricPrecision;
  font-synthesis: none;
}

* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body { background: #ded8cd; }

.viewport {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

.stage {
  position: absolute;
  left: 50%;
  top: 50%;
  width: var(--stage-width);
  height: var(--stage-height);
  overflow: hidden;
  transform: translate(-50%, -50%) scale(var(--stage-scale, 1));
  transform-origin: center center;
  background: var(--paper);
  isolation: isolate;
}

.stage::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -2;
  background: linear-gradient(rgba(255,255,255,.12), rgba(255,255,255,.12)), var(--paper);
}

.stage::after {
  content: "";
  position: absolute;
  inset: 44px;
  z-index: 20;
  border: 1px solid rgba(34, 35, 31, 0.045);
  border-radius: 40px;
  pointer-events: none;
}

.scene {
  position: absolute;
  inset: 0;
  padding: 126px 132px 112px 148px;
}

.copy-zone {
  position: relative;
  z-index: 3;
  width: 1120px;
  height: 100%;
}

.intro-block,
.request-stack,
.payoff-block,
.brand-block,
.mascot-wrap {
  opacity: 0;
}

.intro-block {
  position: absolute;
  left: 0;
  top: 34px;
  width: 1020px;
}

.intro-line {
  margin: 0;
  max-width: 940px;
  color: var(--ink-soft);
  font-size: 38px;
  line-height: 1.14;
  font-weight: 620;
  letter-spacing: -0.036em;
}

.intro-somebody {
  margin: 18px 0 0;
  font-size: 112px;
  line-height: .92;
  font-weight: 790;
  letter-spacing: -0.074em;
}

.request-stack {
  position: absolute;
  left: 0;
  bottom: 40px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 960px;
}

.request {
  align-self: flex-start;
  padding: 18px 24px 20px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--surface);
  box-shadow: 0 14px 38px rgba(42, 37, 29, 0.055);
  color: #3a3a35;
  font-size: 29px;
  font-weight: 570;
  letter-spacing: -0.035em;
  opacity: 0;
  transform: translateY(10px);
  backdrop-filter: blur(10px);
}

.request-two { margin-left: 54px; }
.request-three { max-width: 930px; margin-left: 106px; }

.mascot-wrap {
  position: absolute;
  right: 96px;
  top: 154px;
  z-index: 2;
  width: 650px;
  height: 760px;
}

.mascot-halo {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 680px;
  height: 680px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: rgba(255, 255, 255, 0.54);
  box-shadow: 0 0 0 1px rgba(34, 35, 31, 0.035);
}

.mascot {
  position: relative;
  z-index: 1;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  filter: drop-shadow(0 28px 38px rgba(45, 39, 31, 0.10));
  clip-path: inset(0 0 18% 0);
  transform: translateY(32px) scale(1.08);
  transform-origin: center 40%;
}

.payoff-block,
.brand-block {
  position: absolute;
  left: 0;
  top: 250px;
  width: 1020px;
}

.payoff-block p {
  margin: 0;
  color: var(--ink-soft);
  font-size: 45px;
  font-weight: 620;
  letter-spacing: -0.045em;
}

.payoff-block strong {
  display: block;
  margin-top: 2px;
  font-size: 136px;
  line-height: .93;
  font-weight: 790;
  letter-spacing: -0.075em;
}

.brand-block span {
  display: block;
  margin-bottom: 10px;
  color: var(--ink-soft);
  font-size: 34px;
  font-weight: 620;
  letter-spacing: -0.035em;
}

.brand-block strong {
  display: block;
  font-size: 138px;
  line-height: .92;
  font-weight: 790;
  letter-spacing: -0.078em;
}

/* Fixed 15.0 second timeline. Final reveal lands at 12.2s and holds cleanly to 15.0s. */
.is-playing .intro-block {
  animation:
    intro-in .68s cubic-bezier(.2,.78,.25,1) .18s forwards,
    intro-out .50s ease 7.55s forwards;
}

.is-playing .mascot-wrap {
  animation: mascot-in .88s cubic-bezier(.2,.78,.25,1) .28s forwards;
}

.is-playing .request-stack {
  animation:
    stack-in .01s linear 2.22s forwards,
    intro-out .48s ease 7.55s forwards;
}

.is-playing .request-one {
  animation: request-in .48s cubic-bezier(.2,.75,.25,1) 2.28s forwards;
}

.is-playing .request-two {
  animation: request-in .48s cubic-bezier(.2,.75,.25,1) 3.73s forwards;
}

.is-playing .request-three {
  animation: request-in .52s cubic-bezier(.2,.75,.25,1) 5.18s forwards;
}

.is-playing .payoff-block {
  animation:
    payoff-in .62s cubic-bezier(.2,.78,.25,1) 8.12s forwards,
    intro-out .46s ease 10.46s forwards;
}

.is-playing .brand-block {
  animation: payoff-in .70s cubic-bezier(.2,.78,.25,1) 11.32s forwards;
}

@keyframes intro-in {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes intro-out {
  to { opacity: 0; transform: translateY(-8px); }
}

@keyframes stack-in { to { opacity: 1; } }
@keyframes request-in { to { opacity: 1; transform: translateY(0); } }

@keyframes mascot-in {
  from { opacity: 0; transform: translateY(12px) scale(.988); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes payoff-in {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  .intro-block, .request-stack, .payoff-block { display: none; }
  .mascot-wrap, .brand-block {
    opacity: 1 !important;
    animation: none !important;
    transform: none !important;
  }
}

</style>

  <script>
(() => {
  const DESIGN_WIDTH = 1920;
  const DESIGN_HEIGHT = 1080;
  const SEQUENCE_DURATION_MS = 15000;

  const stage = document.getElementById("stage");
  if (!stage) return;

  let assetsReady = false;
  let startToken = 0;

  function fitStage() {
    const scale = Math.min(
      window.innerWidth / DESIGN_WIDTH,
      window.innerHeight / DESIGN_HEIGHT,
    );
    stage.style.setProperty("--stage-scale", String(scale));
  }

  async function preloadAssets() {
    if (assetsReady) return;
    const images = Array.from(document.images);
    await Promise.all(
      images.map(async (image) => {
        if (!image.complete) {
          await new Promise((resolve) => {
            image.addEventListener("load", resolve, { once: true });
            image.addEventListener("error", resolve, { once: true });
          });
        }
        if (typeof image.decode === "function") {
          try { await image.decode(); } catch { /* keep recorder moving */ }
        }
      }),
    );
    assetsReady = true;
  }

  function restartSequence() {
    startToken += 1;
    const token = startToken;
    stage.classList.remove("is-playing");
    void stage.offsetWidth;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        if (token === startToken) {
          stage.classList.add("is-playing");
          window.dispatchEvent(new CustomEvent("somebody:sequence-start", {
            detail: { durationMs: SEQUENCE_DURATION_MS },
          }));
        }
      });
    });
  }

  window.addEventListener("resize", fitStage, { passive: true });
  window.addEventListener("keydown", (event) => {
    if (event.repeat) return;
    const key = event.key.toLowerCase();
    if (key === "r" || key === " ") {
      event.preventDefault();
      restartSequence();
    }
  });

  window.SomebodySeq1 = {
    restart: restartSequence,
    durationMs: SEQUENCE_DURATION_MS,
  };

  fitStage();
  const manualStart = new URLSearchParams(window.location.search).get("manual") === "1";
  void preloadAssets().then(() => {
    window.dispatchEvent(new CustomEvent("somebody:sequence-ready"));
    if (!manualStart) restartSequence();
  });
})();

</script>
