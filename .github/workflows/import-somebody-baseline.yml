name: Import Somebody baseline

on:
  push:
    paths:
      - .github/workflows/import-somebody-baseline.yml

permissions:
  contents: write

jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Somebody OKX
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone exact Somebody source baseline
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/dropandresetmain-prog/somebody-ai.git /tmp/somebody-ai
          git -C /tmp/somebody-ai checkout --quiet 709a169a1a4f71b8dc2d7427438ff514999fb07e
          test "$(git -C /tmp/somebody-ai rev-parse HEAD)" = "709a169a1a4f71b15f59270ec97bdba36a6f2" && exit 99 || true
          test "$(git -C /tmp/somebody-ai rev-parse HEAD)" = "709a169a1a4f71b8dc2d7427438ff514999fb07e"

      - name: Copy application baseline without overwriting OKX SSOT
        shell: bash
        run: |
          set -euo pipefail
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='README.md' \
            --exclude='ARCHITECTURE.md' \
            --exclude='PROJECT_BRIEF.md' \
            --exclude='docs/' \
            /tmp/somebody-ai/ ./

          mkdir -p docs/legacy/somebody-ai
          cp /tmp/somebody-ai/README.md docs/legacy/somebody-ai/README.md
          cp /tmp/somebody-ai/ARCHITECTURE.md docs/legacy/somebody-ai/ARCHITECTURE.md
          cp /tmp/somebody-ai/PROJECT_BRIEF.md docs/legacy/somebody-ai/PROJECT_BRIEF.md

          cat > docs/legacy/somebody-ai/SOURCE.md <<'EOF'
          # Somebody source provenance

          Imported from `dropandresetmain-prog/somebody-ai` at:

          `709a169a1a4f71b8dc2d7427438ff514999fb07e`

          Imported on 17 September 2026 as the working engineering baseline for Somebody × OKX.

          The root README/architecture/product SSOT in `somebody-okx` supersedes the legacy documents copied into this folder.
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Baseline tests
        run: npm test

      - name: Root typecheck
        run: npm run typecheck

      - name: Convex typecheck
        run: npm run typecheck:convex

      - name: Commit exact transferred baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "somebody-okx-transfer"
          git config user.email "actions@users.noreply.github.com"

          while IFS= read -r -d '' record; do
            path="${record:3}"
            git add -- "$path"
          done < <(git status --porcelain=v1 -z --untracked-files=all)

          if git diff --cached --quiet; then
            echo "No transfer changes to commit"
            exit 0
          fi

          git commit -m "chore: transfer Somebody baseline from 709a169"
          git push origin HEAD:main
