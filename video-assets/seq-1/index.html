<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Somebody × OKX — SEQ-1 Brand Hook</title>
    <link rel="preload" as="image" href="../assets/somebody-neutral.webp" />
    <link rel="stylesheet" href="./seq-1.css" />
    <script src="./seq-1.js" defer></script>
  </head>
  <body>
    <div class="viewport" aria-label="Somebody video sequence 1">
      <main class="stage" id="stage">
        <section class="scene" aria-label="Brand hook">
          <div class="copy-zone">
            <div class="intro-block">
              <p class="intro-line">Every small company has a mysterious employee called</p>
              <h1 class="intro-somebody">somebody.</h1>
            </div>

            <div class="request-stack" aria-label="Incoming requests">
              <div class="request request-one">Can somebody get quotes?</div>
              <div class="request request-two">Can somebody chase this?</div>
              <div class="request request-three">
                Can somebody figure out whether this can arrive by Thursday?
              </div>
            </div>

            <div class="payoff-block">
              <p>Usually, that somebody is</p>
              <strong>you.</strong>
            </div>

            <div class="brand-block">
              <span>So we built</span>
              <strong>Somebody.</strong>
            </div>
          </div>

          <div class="mascot-wrap" aria-hidden="true">
            <div class="mascot-halo"></div>
            <img
              class="mascot"
              src="../assets/somebody-neutral.webp"
              alt=""
              draggable="false"
            />
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
