<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Somebody × OKX — SEQ 1.3 Brand Hook</title>
<style>
:root{--paper:#f5f2eb;--w:1920px;--h:1080px;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#ded8cd}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#ded8cd}.viewport{position:relative;width:100vw;height:100vh;overflow:hidden}.stage{position:absolute;left:50%;top:50%;width:var(--w);height:var(--h);transform:translate(-50%,-50%) scale(var(--stage-scale,1));transform-origin:center;background:var(--paper);overflow:hidden;isolation:isolate}.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(#ffffff1f,#ffffff1f),var(--paper);z-index:-2}.stage:after{content:"";position:absolute;inset:44px;border:1px solid #22231f0b;border-radius:40px;pointer-events:none;z-index:10}.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;will-change:opacity;user-select:none;-webkit-user-drag:none}.is-playing .s1{animation:a1 15s linear forwards}.is-playing .s2{animation:a2 15s linear forwards}.is-playing .s3{animation:a3 15s linear forwards}.is-playing .s4{animation:a4 15s linear forwards}@keyframes a1{0%{opacity:0}2%{opacity:1}18%{opacity:1}20%{opacity:0}100%{opacity:0}}@keyframes a2{0%,20%{opacity:0}22%{opacity:1}58%{opacity:1}60%{opacity:0}100%{opacity:0}}@keyframes a3{0%,60%{opacity:0}62%{opacity:1}78%{opacity:1}80%{opacity:0}100%{opacity:0}}@keyframes a4{0%,80%{opacity:0}82%{opacity:1}98%{opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){.shot{animation:none!important}.s4{opacity:1!important}}
</style>
</head>
<body>
<div class="viewport"><main class="stage" id="stage">
<img class="shot s1" alt="Shot 1" src="./shot-01.webp">
<img class="shot s2" alt="Shot 2" src="./shot-02.webp">
<img class="shot s3" alt="Shot 3" src="./shot-03.webp">
<img class="shot s4" alt="Shot 4" src="./shot-04.webp">
</main></div>
<script>
(()=>{const W=1920,H=1080,s=document.getElementById("stage");let t=0;function fit(){s.style.setProperty("--stage-scale",String(Math.min(innerWidth/W,innerHeight/H)))}function preload(){return Promise.all([...document.images].map(i=>i.complete?Promise.resolve():new Promise(r=>{i.addEventListener("load",r,{once:true});i.addEventListener("error",r,{once:true})})))}function restart(){t++;const x=t;s.classList.remove("is-playing");void s.offsetWidth;requestAnimationFrame(()=>requestAnimationFrame(()=>{if(x===t)s.classList.add("is-playing")}))}addEventListener("resize",fit,{passive:true});addEventListener("keydown",e=>{if(e.repeat)return;const k=e.key.toLowerCase();if(k==="r"||k===" "){e.preventDefault();restart()}});window.SomebodySeq13={restart,durationMs:15000};fit();preload().then(restart)})();
</script>
</body>
</html>
